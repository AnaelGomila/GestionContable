[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# La app usa rutas de React Router (/ventas, /facturas/3, ...):
# cualquier ruta debe devolver index.html para que no dé 404 al recargar.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
